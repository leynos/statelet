# Canonical opt-in Cargo configuration fragment for accelerated local debug
# builds.
#
# This fragment is passed to Cargo explicitly, with
# `cargo --config tools/dev-fast/config.toml ...` from `make dev-build` and
# `make dev-test`, rather than being auto-discovered.
#
# An earlier version of this header stated that the configuration was
# deliberately kept out of `.cargo/config.toml` because Cargo would otherwise
# apply it to release packaging, coverage and verification builds. That was in
# error and is withdrawn (statelet#60). Dev-profile Cranelift with mold is the
# estate standard for development, test, lint, and proof builds, and this
# repository's `.cargo/config.toml` sets it for that reason. Release builds are
# unaffected, because `--release` selects a profile neither file configures,
# and coverage overrides the backend explicitly for its own invocation because
# `-Cinstrument-coverage` is LLVM-specific.
#
# What this fragment still adds over `.cargo/config.toml` is the linker
# selector below: a `cfg(target_os = "linux")` table rather than the
# `x86_64-unknown-linux-gnu` triple, so it also covers other Linux
# architectures.
#
# Repositories that set repository-wide `rustflags` in `.cargo/config.toml`
# must restate them in the target table below. Cargo joins the rustflags of
# every matching `[target.*]` entry (target-triple and `cfg` tables alike),
# but the joined target rustflags take precedence over `[build].rustflags`
# rather than merging with it.

[unstable]
codegen-backend = true

# Cranelift trades runtime performance for compile speed, so it applies to
# the dev profile only. The `make dev-*` targets never build release
# artefacts.
[profile.dev]
codegen-backend = "cranelift"

# mold ships for Linux only, so the flag is gated behind a target `cfg`. On
# macOS and Windows the table simply does not apply and the platform default
# linker is used.
[target.'cfg(target_os = "linux")']
rustflags = ["-Clink-arg=-fuse-ld=mold"]
