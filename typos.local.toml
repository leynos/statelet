# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# Preserve exact external spellings in executable syntax and recorded evidence.
# Ordinary prose still follows the en-GB spelling rules.
ignore = [
  # The linker selector, product path, archive and executable are fixed upstream.
  "-fuse-ld=mold",
  "tools/mold/",
  "└── mold/",
  "github\\.com/rui314/mold/releases/download",
  "mold-(?:2\\.41\\.0-(?:x86_64|aarch64)-linux|fixture)\\.tar\\.gz",
  # Preserve the exact version/architecture placeholders in archive fixtures.
  "mold-\\{MOLD_VERSION\\}-\\{architecture\\}-linux\\.tar\\.gz",
  "name=\\\"mold-\\$version-\\$arch-linux\\.tar\\.gz\\\"",
  "command -v mold",
  "mold --version",
  "binary_dir / \\\"mold\\\"",
  "tool_bin / \\\"mold\\\"",
  '"tools" / "mold" / "VERSION"',
  "`mold`",
  # Script, Make, and contract identifiers name the external tool.
  "\\bMOLD_(?:RELEASE_BASE_URL|SHA256SUMS_FILE|TEST_VERSION|VERSION|VERSION_FILE)\\b",
  "\\bSTANDARD_MOLD_FLAG\\b",
  "\\b(?:mold_arch|mold_version|mold_pin|installed_mold_version|check_mold|install_mold|verify_mold_archive)\\b",
  # Exact diagnostics and fixture output checked by script contracts.
  "mold is Linux-only",
  "mold not found on PATH",
  "mold at \\$resolved",
  "mold \\$installed at \\$resolved",
  "mold \\{MOLD_VERSION\\}",
  "mold \\{linker_version\\}",
  "mold %s",
  "installed mold \\$version into",
  # The hand-install contract matches fixed package names and preserves its
  # exact apt command fixtures, including the continued source literal.
  '\(clang\|lld\|mold\)',
  '"sudo apt-get install --yes clang lld mold"',
  '"sudo apt-get install --yes \\\\\\n  clang lld mold"',
  # Public CI keys and event names must keep their API spelling.
  "\\binstall-mold\\b",
  "\\bCARGO_TERM_COLOR\\b",
  "opened, reopened, synchronize, labeled, ready_for_review",
  # The historical plan records rejected tokens and exact commit IDs; its
  # bytes are evidence and must not be reformatted or edited.
  "`(?:recognise|recognised|recognises|mis-spelling|mis-addressed|mis)`",
  "\\b(?:8ba3e4a|d4fb5ba)\\b",
]

[files]
exclude = []
