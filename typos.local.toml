# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# Preserve complete formal names while allowing Markdown line wrapping.
ignore = [
  # Inline code spans, which this repository's spelling check has always
  # masked; preserved through the migration to the shared gate.
  '`[^`\n]+`',
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # contexts only; the mould correction stays active elsewhere.
  "-fuse-ld=mold",
  "mold linker",
  "Cranelift \\+ mold",
  "Cranelift and mold",
  "`mold`",
  "GitHub\\s+Flavored\\s+Markdown",
]

[files]
exclude = []
