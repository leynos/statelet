name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@ff1dd759dfffc0db3459e30e833f52437ee62b57
    with:
      # CI runs tests with --all-features, so mutants must face the same
      # feature surface.
      extra-args: "--all-features"
      # The shared workflow runs these commands after checkout and before
      # cargo-mutants. Plain Cargo uses the pinned development linker.
      setup-commands: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends clang lld
        make install-build-tools
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
