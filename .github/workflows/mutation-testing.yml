name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@f4764bea8d813b1a8f7ebc37a44907d3c3b1e0e4
    with:
      # CI runs tests with --all-features, so mutants must face the same
      # feature surface.
      extra-args: "--all-features"
      # .cargo/config.toml pins the linker to clang with mold, so plain
      # cargo builds fail without them; mirror the CI install step.
      setup-commands: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends clang lld mold
