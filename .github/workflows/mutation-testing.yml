name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@5ac271baf94615e9a876ce1b77a4b266dd81f201
    with:
      # CI runs tests with --all-features, so mutants must face the same
      # feature surface.
      extra-args: "--all-features"
      # .cargo/config.toml pins the linker to clang with `mold`, so plain
      # cargo builds fail without them; mirror the CI setup-rust inputs.
      install-mold: 'true'
      install-clang-lld: 'true'
      # setup-rust owns the linkers; add Statelet's extra Rust components.
      setup-commands: |
        make install-rust-toolchain
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
