name: Coverage (main)

# Main owns both persistent coverage outputs: the CodeScene upload and the
# ratchet baseline. Pull requests generate coverage only for their own ratchet
# check, in ci.yml; they neither publish a report nor contact CodeScene.
# CodeScene accepts `cs-coverage upload` only for an analysed branch, which a
# pull request head is not, and its check mode fails on every project whose
# coverage gates are off. Caches written on main are readable by every
# pull-request run, so the baseline written here is the one those ratchet
# checks compare against. tests/workflow_contracts/codescene_coverage_test.py
# holds this shape.
#
# Known exception: a Dependabot pull request merged by the automerge workflow
# with GITHUB_TOKEN fires no push event, so that merge publishes nothing until
# the next push to main (shared-actions #518 tracks the fix).

'on':
  push:
    branches: [main]
  # A dispatch may name any branch, so the upload step's ref conjunct is what
  # keeps a branch's coverage out of CodeScene.
  workflow_dispatch:

# One group per ref, never cancelled. A cancelled publisher abandons both its
# upload and its baseline write. Runs for the same ref never overlap, and
# GitHub keeps at most one pending run per group, so a newer trigger replaces
# an older pending run rather than queueing behind it. GitHub does not promise
# to start runs in trigger order, so this is not a guarantee of commit order.
# A manual re-run of an older run keeps its SHA and its run id: it republishes
# that commit's coverage to CodeScene. Its baseline cache key is the original
# run's, so it saves a baseline only when that entry is absent: the original
# run saved none, or the entry has expired or been evicted.
# Keying the group on the event as well would let a dispatch and a push on
# main run side by side. A dispatch saves no baseline: generate-coverage saves
# it only on a push, so after a dispatch replaces a pending push the baseline
# stays behind until the next push (shared-actions #518).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@82feb2b7aac45b7efff40c9c4bb632551b14521c
      - name: Install mold linker
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # mold accelerates dev builds; coverage uses lld for llvm-tools compatibility.
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Install test runner
        env:
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm cargo-nextest
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@82feb2b7aac45b7efff40c9c4bb632551b14521c
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      # Whether the token is set, as a plain step output. The expression is
      # evaluated before the shell runs, so this step binds nothing: the token
      # sits in no `env` in this workflow, because the upload action is
      # composite and hands its step's `env` to the nested steps it runs.
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        if: ${{ steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main' }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@82feb2b7aac45b7efff40c9c4bb632551b14521c
        with:
          path: lcov.info
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
