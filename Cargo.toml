[package]
name = "statelet"
version = "0.1.0"
edition = "2024"
description = "Transition-boundary macros for ordinary Rust state machines"
license = "ISC"
repository = "https://github.com/leynos/statelet"
keywords = ["macros", "state-machines", "fsm", "o11y"]
categories = ["development-tools"]

[dependencies]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 1. hygiene
allow_attributes                    = "deny"
allow_attributes_without_reason     = "deny"
blanket_clippy_restriction_lints    = "deny"
cognitive_complexity                = "deny"
disallowed_methods                  = "deny"
needless_pass_by_value              = "deny"
implicit_hasher                     = "deny"
missing_assert_message              = "deny"
missing_docs_in_private_items       = "deny"

# 2. debugging leftovers
dbg_macro                           = "deny"
print_stdout                        = "deny"
print_stderr                        = "deny"

# 2. panic-prone operations
unwrap_used                         = "deny"
expect_used                         = "deny"
indexing_slicing                    = "deny"
string_slice                        = "deny"
integer_division                    = "deny"
integer_division_remainder_used     = "deny"
panic_in_result_fn                  = "deny"
unreachable                         = "deny"

# 4. portability
host_endian_bytes                   = "deny"
little_endian_bytes                 = "deny"
big_endian_bytes                    = "deny"

# 5. nursery idiom polish
let_underscore_must_use             = "deny"
or_fun_call                         = "deny"
option_if_let_else                  = "deny"
self_named_module_files             = "deny"
shadow_reuse                        = "deny"
shadow_same                         = "deny"
shadow_unrelated                    = "deny"
str_to_string                       = "deny"
string_lit_as_bytes                 = "deny"
try_err                             = "deny"
unneeded_field_pattern              = "deny"
use_self                            = "deny"

# 6. numerical foot-guns
float_arithmetic                    = "deny"
cast_possible_truncation            = "deny"
cast_possible_wrap                  = "deny"
cast_precision_loss                 = "deny"
lossy_float_literal                 = "deny"

# 7. API ergonomics
missing_const_for_fn                = "deny"
must_use_candidate                  = "deny"
unused_async                        = "deny"

# 8. Error handling
missing_panics_doc                  = "deny"
error_impl_error                    = "deny"
result_large_err                    = "deny"

[lints.rust]
unknown_lints                       = "deny"
renamed_and_removed_lints           = "deny"
unsafe_code                         = "forbid"
missing_docs                        = "deny"

[lints.rustdoc]
missing_crate_level_docs            = "deny"
broken_intra_doc_links              = "deny"
private_intra_doc_links             = "deny"
bare_urls                           = "deny"
invalid_html_tags                   = "deny"
invalid_codeblock_attributes        = "deny"
unescaped_backticks                 = "deny"

[dev-dependencies]
# The topology command boundary builds isolated Cargo manifests in a scratch
# directory. Capability-scoped access keeps those writes inside one opened
# directory handle instead of ambient `std::fs` calls; the developer guide
# records the boundary. See D9 in the topology-check plan.
cap-std = "4.0.3"
camino = "1.2.5"
googletest = "0.14.3"
pretty_assertions = "1.4.1"
# The evidence predicates read arbitrary text, so their invariants are
# properties rather than cases; measured at 45 to 75 resolved packages when
# added. See D8 in the plan for the resulting scope.
proptest = "1.11.0"
rstest = "0.27.0"
# Behavioural scenarios for the topology policy run through the repository's
# BDD framework rather than a second policy implementation. The 0.6.0 pair was
# preflighted with this repository's rstest 0.27.0 on 2026-10-18.
rstest-bdd = "0.6.0"
rstest-bdd-macros = "0.6.0"
# Cargo metadata is JSON, and the topology policy reads it as a document rather
# than trusting a schema version it cannot inspect.
serde_json = "1.0.154"
# Private acquisition and policy errors are semantic enums at the test-only
# boundary; `thiserror` derives their `Display` and `Error` implementations.
thiserror = "2.0.21"
# The codegen-backend contract parses `.cargo/config.toml` structurally; a
# substring search would accept a commented-out table as a live one.
toml = "1.1.4"
